name: Windows installer

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and upload
        required: true
        default: v0.2.1

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build app image
        shell: pwsh
        run: ./gradlew.bat -p desktop createDistributable --no-daemon

      - name: Prepare Inno Setup 6.0.5
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/dscharrer/innoextract/releases/download/1.9/innoextract-1.9-windows.zip" -OutFile innoextract.zip
          Expand-Archive -Path innoextract.zip -DestinationPath innoextract -Force
          Invoke-WebRequest -Uri "https://github.com/jrsoftware/issrc/releases/download/is-6_0_5/innosetup-6.0.5.exe" -OutFile innosetup.exe
          .\innoextract\innoextract.exe -e -d innosetup innosetup.exe

      - name: Compile installer
        shell: pwsh
        run: |
          $version = "${{ inputs.tag }}".TrimStart('v')
          & ".\innosetup\app\ISCC.exe" desktop/package/BitChord.iss
          $installer = "desktop/build/compose/binaries/main/inno/BitChord-$version-setup.exe"
          if (-not (Test-Path $installer)) { throw "installer not found: $installer" }
          $sha = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLower()
          Write-Host "INSTALLER_SHA256=$sha"
          "### BitChord $version installer`n`nSHA-256: ``$sha``" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY

      - name: Upload to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ inputs.tag }}".TrimStart('v')
          $installer = "desktop/build/compose/binaries/main/inno/BitChord-$version-setup.exe"
          gh release upload "${{ inputs.tag }}" $installer --clobber
